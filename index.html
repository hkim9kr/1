<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE OS | Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;600;800&display=swap');
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        .font-brand { font-family: 'Orbitron', sans-serif; }
        .input-field { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; }
        .hidden { display: none; }
        .bg-overlay {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), 
                        url('https://images.unsplash.com/photo-1519861531473-9200262188bf?q=80&w=1000&auto=format&fit=crop');
            background-size: cover; background-position: center;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-center bg-overlay px-8">
    <div class="max-w-sm mx-auto w-full">
        <div class="text-center mb-12">
            <h1 class="font-brand text-5xl font-black italic tracking-tighter">ELITE<span class="text-[#CCFF00]">OS</span></h1>
            <p class="text-gray-400 text-[10px] uppercase tracking-[0.4em] mt-2 font-bold">Student Athlete Protocol</p>
        </div>

        <div id="signin-form" class="space-y-4">
            <h2 class="text-2xl font-black uppercase italic tracking-tight">Sign In</h2>
            <div class="space-y-3">
                <input type="email" placeholder="Athlete Email" class="w-full p-4 rounded-xl input-field focus:border-[#CCFF00]/50 outline-none">
                <input type="password" placeholder="Password" class="w-full p-4 rounded-xl input-field focus:border-[#CCFF00]/50 outline-none">
            </div>
            <button onclick="window.location.href='main.html'" class="w-full bg-[#CCFF00] text-black font-black py-4 rounded-xl uppercase italic active:scale-95 transition-all">
                Access Protocol
            </button>
            <p class="text-center text-xs text-gray-500">
                New Athlete? <button onclick="toggleForm()" class="text-[#CCFF00] font-bold">Create Account</button>
            </p>
        </div>

        <div id="signup-form" class="space-y-4 hidden">
            <h2 class="text-2xl font-black uppercase italic tracking-tight text-[#CCFF00]">Create Account</h2>
            <div class="space-y-3">
                <input type="text" placeholder="Full Name" class="w-full p-4 rounded-xl input-field focus:border-[#CCFF00]/50 outline-none">
                <input type="email" placeholder="Email Address" class="w-full p-4 rounded-xl input-field focus:border-[#CCFF00]/50 outline-none">
                <input type="password" placeholder="
